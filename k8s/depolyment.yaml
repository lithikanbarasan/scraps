apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scraps
  template:
    metadata:
      labels:
        app: scraps
    spec:
      containers:
        - name: scraps
          image: scraps:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: scraps-env
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"